name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm test
      - name: action.yml and workflows are valid YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in ['action.yml', *glob.glob('.github/workflows/*.yml'), *glob.glob('examples/*.yml')]]"
